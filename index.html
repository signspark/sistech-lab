<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SISTECH LAB · 3D 기능 실험실</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Widgets/widgets.css">
<style>
/* ---- SISTECH EARTH 디자인 그대로 (실험 UI가 EARTH와 같은 모양이 되도록) ---- */

:root{
  --navy-950:#03122A; --navy-900:#06224A; --navy:#003A80; --navy-700:#0B4FA3;
  --panel:rgba(6,34,74,.86); --panel-solid:#06224A; --line:rgba(127,178,230,.22); --line-strong:rgba(127,178,230,.45);
  --text:#DCE8F5; --text-dim:#8FA7C4; --lime:#A4C81C; --lime-bright:#BFE33A; --lime-dim:rgba(164,200,28,.18);
  --amber:#F2A65A; --red:#FF5D5D; --cyan:#3FC7C0; --sky:#7FB7F5;
  --r:12px; --r-sm:8px; --tap:40px;
  --font:Inter,"Noto Sans KR","Segoe UI","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy-950);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}
#cesium{position:fixed;inset:0}
#cesium .cesium-viewer-bottom{display:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.45)}

/* 상단 바 */
#topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 14px;z-index:30;pointer-events:none}
#topbar>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:8px;user-select:none}
.brand .word{font-weight:800;font-size:19px;letter-spacing:.06em;color:#fff}
.brand .word b{color:var(--lime);font-weight:900}
.brand .sub{font-weight:300;font-size:13px;letter-spacing:.32em;color:var(--text-dim)}
.modes{display:flex;gap:4px;background:rgba(3,18,42,.7);border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{padding:6px 16px;border-radius:999px;font-weight:600;font-size:13px;color:var(--text-dim)}
.modes button.on{background:var(--navy);color:#fff;box-shadow:inset 0 0 0 1px var(--line-strong)}
.modes button.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:8px;vertical-align:1px}
.icons{display:flex;gap:4px}
.icons button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text-dim)}
.icons button:hover{background:rgba(255,255,255,.08);color:#fff}
.icons svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stage{display:flex;gap:2px;align-items:center;background:rgba(3,18,42,.7);border:1px solid var(--line);border-radius:999px;padding:3px 6px;font-size:12px;color:var(--text-dim)}
#stage span{padding:3px 10px;border-radius:999px}
#stage span.on{background:var(--lime-dim);color:var(--lime-bright);font-weight:700}
#alert{margin-left:auto;display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;background:rgba(3,18,42,.92);border:1px solid var(--amber);border-radius:var(--r-sm);font-size:13px}
#alert .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
#alert b{color:#fff}
#alert small{color:var(--text-dim)}
#alert button{color:var(--text-dim);font-size:16px;line-height:1}

/* 검색 */
#search{position:fixed;top:60px;left:50%;transform:translateX(-50%);width:min(560px,92vw);z-index:40;display:none;padding:10px}
#search.open{display:block}
#search input{width:100%;height:42px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:rgba(3,18,42,.8);color:#fff;padding:0 14px;font-size:15px;font-family:inherit}
#search ul{list-style:none;margin:8px 0 0;padding:0;max-height:40vh;overflow:auto}
#search li{padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#search li:hover{background:rgba(255,255,255,.07)}
#search li small{color:var(--text-dim)}
#search .hint{font-size:12px;color:var(--text-dim);padding:6px 4px 0}

/* 설정 */
#settings{position:fixed;top:60px;left:360px;width:320px;z-index:40;display:none;padding:14px 16px}
#settings.open{display:block}
#settings h3{margin:0 0 10px;font-size:13px;color:var(--text-dim);font-weight:600;letter-spacing:.04em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.seg{display:flex;gap:3px;background:rgba(3,18,42,.6);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{padding:4px 11px;border-radius:999px;font-size:12px;color:var(--text-dim)}
.seg button.on{background:var(--lime);color:var(--navy-950);font-weight:700}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.switch{width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--lime)}
.switch.on::after{left:19px;background:var(--navy-950)}

/* 좌측 레일 */
#rail{position:fixed;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:25}
#rail button{writing-mode:vertical-rl;transform:rotate(180deg);padding:18px 9px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--line);color:var(--text-dim);font-size:12px;letter-spacing:.22em;font-weight:700}
#rail button.on{color:#fff;border-color:var(--lime);box-shadow:inset 3px 0 0 var(--lime)}

/* 메뉴 */
#menu{position:fixed;left:48px;top:72px;bottom:120px;display:flex;z-index:20;max-height:calc(100vh - 192px)}
#cats{width:150px;display:flex;flex-direction:column;padding:10px 8px;overflow:auto}
#cats .hd{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;font-size:11px;letter-spacing:.2em;color:var(--text-dim);font-weight:700}
#cats .hd button{color:var(--text-dim);font-size:16px}
#cats .cat{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);font-size:14px;color:var(--text);text-align:left;width:100%}
#cats .cat:hover{background:rgba(255,255,255,.06)}
#cats .cat.on{background:var(--navy);color:#fff;box-shadow:inset 0 0 0 1px var(--line-strong)}
#cats .cat.on::after{content:"›";margin-left:auto;color:var(--lime)}
#cats .cat svg{width:18px;height:18px;stroke:var(--lime);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#cats .cat .n{position:relative}
#cats .cat .cnt{position:absolute;top:-6px;right:-14px;font-size:9px;background:var(--lime);color:var(--navy-950);border-radius:999px;padding:0 4px;font-weight:800;line-height:14px}
#cats .quick{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding-top:10px}
#cats .quick button{padding:8px 4px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:12px;color:var(--text)}
#cats .quick button:hover{border-color:var(--lime);color:#fff}
#sub{width:272px;margin-left:6px;display:none;flex-direction:column;overflow:hidden}
#sub.open{display:flex}
#sub .hd{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line)}
#sub .hd button{color:var(--text-dim)}
#sub .hd small{margin-left:auto;font-weight:400;font-size:11px;color:var(--text-dim)}
#sub .filter{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:var(--text-dim);border-bottom:1px solid var(--line)}
#sub .filter input{accent-color:var(--lime)}
#sub .list{overflow:auto;padding:6px;flex:1}
.item{display:flex;align-items:flex-start;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-sm);text-align:left;color:var(--text)}
.item:hover{background:rgba(255,255,255,.06)}
.item .ind{flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong);margin-top:3px;position:relative}
.item.on .ind{border-color:var(--lime);background:var(--lime);box-shadow:0 0 10px rgba(164,200,28,.6)}
.item .t{display:flex;flex-direction:column;gap:2px;flex:1}
.item .t b{font-weight:600;font-size:14px}
.item.on .t b{color:var(--lime)}
.item .t span{font-size:12px;color:var(--text-dim)}
.item .badge{flex:none;font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim);margin-top:3px}
.item.soon{opacity:.55}
.item.soon .badge{border-color:var(--amber);color:var(--amber)}
.item.site .badge{border-color:var(--sky);color:var(--sky)}
.item.action .ind{border-radius:3px;border-color:var(--lime)}
.item.action .ind::after{content:"";position:absolute;inset:3px;background:var(--lime);border-radius:1px;opacity:.7}
.item .src{font-size:11px;color:var(--text-dim);opacity:.8}
.proj{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-sm);text-align:left}
.proj:hover{background:rgba(255,255,255,.06)}
.proj .pin{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(164,200,28,.25);flex:none}
.proj .pin.plan{background:var(--amber);box-shadow:0 0 0 3px rgba(242,166,90,.25)}
.proj b{font-size:14px;font-weight:600;display:block}
.proj span{font-size:12px;color:var(--text-dim)}
.note{font-size:12px;color:var(--text-dim);padding:8px 12px;line-height:1.5}

/* 지점 카드 */
#card{position:fixed;right:14px;top:72px;width:360px;max-height:calc(100vh - 200px);z-index:20;display:none;flex-direction:column;overflow:hidden}
#card.open{display:flex}
#card .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
#card .hd h2{margin:0;font-size:15px;font-weight:700;flex:1;line-height:1.3}
#card .hd h2 small{display:block;font-weight:400;color:var(--text-dim);font-size:12px}
#card .hd button{color:var(--text-dim);font-size:18px}
#card .body{overflow:auto;padding:4px 14px 12px}
.sec{padding:12px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec .lead{font-size:14px;line-height:1.55;margin:0 0 8px}
.sec .lead b{color:#fff}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.kv div{color:var(--text-dim)}
.kv div b{color:#fff;font-weight:600;margin-left:4px}
.meta{margin-top:8px;font-size:11px;color:var(--text-dim);line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.tag{font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:4px}
.tag.obs{background:var(--lime);color:var(--navy-950)}
.tag.model{background:rgba(127,183,245,.2);color:var(--sky);border:1px solid rgba(127,183,245,.4)}
.tag.derived{background:rgba(242,166,90,.18);color:var(--amber);border:1px solid rgba(242,166,90,.4)}
.tag.drone{background:var(--navy);color:var(--lime-bright);border:1px solid var(--lime)}
.fly{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-sm);font-weight:700;font-size:13px;margin-bottom:8px}
.fly.ok{background:var(--lime-dim);color:var(--lime-bright);border:1px solid rgba(164,200,28,.5)}
.fly.warn{background:rgba(242,166,90,.15);color:var(--amber);border:1px solid rgba(242,166,90,.5)}
.fly.bad{background:rgba(255,93,93,.15);color:var(--red);border:1px solid rgba(255,93,93,.5)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:var(--r-sm);background:var(--lime);color:var(--navy-950);font-weight:800;font-size:14px;text-decoration:none;margin-top:10px}
.cta:hover{background:var(--lime-bright)}
.cta.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong);font-weight:600}
.skeleton{height:12px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06));background-size:200% 100%;animation:sk 1.2s infinite;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}

/* 하단 */
#hud{position:fixed;left:14px;bottom:14px;z-index:20;max-width:min(520px,calc(50vw - 290px));min-width:240px;font-size:12px;color:var(--text-dim);line-height:1.5;text-shadow:0 1px 2px #000}
#hud .top{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--text);margin-bottom:3px}
#hud .top b{color:var(--lime-bright);font-weight:700}
#hud .src b{color:var(--text)}
#timebar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px;padding:8px 12px;width:min(520px,60vw)}
#timebar button{height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--text)}
#timebar button:hover{border-color:var(--lime)}
#timebar button.on{background:var(--lime);color:var(--navy-950);border-color:var(--lime)}
#timebar input[type=range]{flex:1;accent-color:var(--lime);height:4px}
#timebar .lbl{min-width:112px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
#timebar .lbl small{display:block;font-size:10px;color:var(--text-dim);letter-spacing:.1em}
#measure{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;display:none;align-items:center;gap:10px;padding:8px 12px;font-size:13px}
#measure.open{display:flex}
#measure b{color:var(--lime-bright)}
#measure button{padding:5px 10px;border-radius:6px;border:1px solid var(--line);font-size:12px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:50;padding:8px 14px;font-size:13px;display:none}
#toast.open{display:block}
.mlabel{position:absolute;transform:translate(-50%,-130%);padding:3px 8px;border-radius:6px;background:var(--navy);border:1px solid var(--lime);color:var(--lime-bright);font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
#labels{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (max-width:900px){#menu{left:44px}#sub{width:230px}#card{width:300px}#alert{display:none}#stage{display:none}}

/* ---- LAB 전용 ---- */
#topbar .brand .sub{letter-spacing:.32em}
#labBadge{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--navy-950);background:var(--amber);border-radius:6px;padding:3px 7px;margin-left:4px}
#hud .top span{white-space:nowrap}
#topbar .icons{margin-left:auto}
</style>
</head>
<body>
<div id="cesium"></div>
<div id="labels"></div>

<header id="topbar">
  <div class="brand"><span class="word">SI<b>S</b>TECH</span><span class="sub">LAB</span><span id="labBadge">실험용</span></div>
  <div class="icons">
    <button id="btnSettings" title="설정" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </div>
</header>

<div id="settings" class="panel">
  <h3>설정</h3>
  <div class="row"><span>배경 영상</span><div class="seg" id="segBase"><button data-v="vworld">브이월드</button><button data-v="esri">Esri</button></div></div>
  <div class="row"><span title="내장 그래픽용: 지형 화질 한 단계 낮춤 · 8초 무조작 시 렌더 절약">저사양 최적화</span><div class="seg" id="segPerf"><button data-v="on">켬</button><button data-v="off">끔</button></div></div>
  <div class="note" style="padding:10px 0 0">SISTECH LAB은 새 기능을 SISTECH EARTH와 분리해 시험하는 곳입니다. 검증된 기능만 EARTH로 옮깁니다.</div>
</div>

<div id="menu">
  <div id="cats" class="panel"></div>
  <div id="sub" class="panel">
    <div class="hd"><button id="subBack" aria-label="전체 메뉴">‹</button><span id="subTitle"></span><small id="subCount"></small></div>
    <label class="filter"><input type="checkbox" id="onlyOn"> 켜진 항목만</label>
    <div class="list" id="subList"></div>
  </div>
</div>

<aside id="card" class="panel" aria-label="지점 정보">
  <div class="hd"><h2 id="cardTitle">지점</h2><button id="cardClose" aria-label="정보 닫기">✕</button></div>
  <div class="body" id="cardBody"></div>
</aside>

<div id="toast" class="panel"></div>

<div id="hud">
  <div class="top"><span style="display:none">단계 <b id="hudStage">현장</b></span><span>고도 <b id="hudAlt">—</b></span><span>3D 메모리 <b id="hudMem">0 MB</b></span><span>화질 <b id="hudQ">중</b></span><span>FPS <b id="hudFps">—</b></span><span id="hudCursor"></span></div>
  <div class="src" id="hudSrc"></div>
</div>

<script src="lab-core.js?v=1.0"></script>
</body>
</html>
